services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-before-production-123456}
      DATABASE_URL: postgresql+psycopg://datapilot:${POSTGRES_PASSWORD:-datapilot-local-only}@postgres:5432/datapilot
      DATASET_STORAGE_ROOT: /app/data
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_VERSION: ${APP_VERSION:-0.9.0-beta}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-none}
      PRICING_CURRENCY: ${PRICING_CURRENCY:-INR}
      FREE_PRICE_MONTHLY: ${FREE_PRICE_MONTHLY:-0}
      PRO_PRICE_MONTHLY: ${PRO_PRICE_MONTHLY:-}
      BUSINESS_PRICE_MONTHLY: ${BUSINESS_PRICE_MONTHLY:-}
      PRO_TRIAL_ENABLED: ${PRO_TRIAL_ENABLED:-true}
      PRO_TRIAL_DAYS: ${PRO_TRIAL_DAYS:-14}
      PLAN_LIMIT_WARNING_PERCENT: ${PLAN_LIMIT_WARNING_PERCENT:-75}
      PLAN_LIMIT_CRITICAL_PERCENT: ${PLAN_LIMIT_CRITICAL_PERCENT:-90}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      ALLOW_CONSOLE_EMAIL_LINKS: ${ALLOW_CONSOLE_EMAIL_LINKS:-false}
      ALLOW_INSECURE_STAGING_COOKIES: ${ALLOW_INSECURE_STAGING_COOKIES:-false}
      EMAIL_FROM: ${EMAIL_FROM:-DataPilot AI <no-reply@datapilot.local>}
      FEEDBACK_MAX_ATTACHMENTS: ${FEEDBACK_MAX_ATTACHMENTS:-3}
      FEEDBACK_MAX_ATTACHMENT_MB: ${FEEDBACK_MAX_ATTACHMENT_MB:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE:-local}
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    volumes:
      - dataset_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    profiles: ["staging", "distributed"]
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-staging}
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-before-production-123456}
      DATABASE_URL: postgresql+psycopg://datapilot:${POSTGRES_PASSWORD:-datapilot-local-only}@postgres:5432/datapilot
      DATASET_STORAGE_ROOT: /app/data
      JOB_EXECUTION_MODE: redis
      REDIS_URL: redis://redis:6379/0
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
    volumes:
      - dataset_data:/app/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datapilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datapilot-minio-local-only}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/$${S3_BUCKET} && mc anonymous set none local/$${S3_BUCKET}"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datapilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-datapilot-minio-local-only}
      S3_BUCKET: ${S3_BUCKET:-datapilot}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  dataset_data:
  redis_data:
  minio_data:
